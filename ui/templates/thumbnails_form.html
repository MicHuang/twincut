<section class="tab-section">
  <header class="tab-section-header">
    <h2>{{t "thumbnails.title"}}</h2>
    <p class="subtitle">{{t "thumbnails.subtitle.pre"}}<strong>{{t "thumbnails.subtitle.source"}}</strong>{{t "thumbnails.subtitle.post"}}</p>
  </header>

  <form id="thumbnails-form"
        hx-post="/api/thumbnails/preview"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        hx-disabled-elt="find button">

    <label class="field">
      <span class="field-label">{{t "thumbnails.sourceFolder"}}</span>
      <div class="folder-picker">
        <input type="text" name="source" id="thumb-source-input"
               placeholder="/Users/me/Pictures/2024"
               autocomplete="off" required>
      </div>
      {{if .Recents}}
      <div class="recents">
        {{range .Recents}}
          <button type="button" class="recent-chip"
                  onclick="document.getElementById('thumb-source-input').value=this.dataset.path"
                  data-path="{{.}}">{{.}}</button>
        {{end}}
      </div>
      {{end}}
    </label>

    <details class="advanced">
      <summary>{{t "thumbnails.thresholds"}}</summary>
      <div class="advanced-grid">
        <label class="field">
          <span class="field-label">{{t "thumbnails.maxEdge"}}</span>
          <input type="number" name="max_edge" value="512" min="1">
        </label>
        <label class="field">
          <span class="field-label">{{t "thumbnails.maybeMaxEdge"}}</span>
          <input type="number" name="maybe_max_edge" value="1024" min="1">
        </label>
        <label class="field field-wide">
          <span class="field-label">
            <input type="checkbox" name="require_exif_match">
            {{t "thumbnails.requireExifMatch"}}
          </span>
        </label>
      </div>
    </details>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{t "button.preview"}}</button>
    </div>
  </form>
</section>
