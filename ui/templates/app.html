<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twincut</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">twincut</div>
      <div class="app-header-spacer"></div>
      <div class="lang-switcher" title="{{t "nav.langTitle"}}">
        <select id="lang-select" aria-label="{{t "nav.langTitle"}}">
          {{range locales}}<option value="{{.Code}}"{{if eq lang .Code}} selected{{end}}>{{.Name}}</option>{{end}}
        </select>
      </div>
      <div class="app-status" title="{{t "nav.serverStatus"}}">● {{t "nav.statusReady"}}</div>
    </header>

    <aside class="app-sidebar">
      <nav>
        <a href="#" class="nav-item active" hx-get="/tab/self-check" hx-target="#tab-content" hx-swap="innerHTML">
          {{t "nav.selfCheck"}}
        </a>
        <a href="#" class="nav-item" hx-get="/tab/cross-check" hx-target="#tab-content" hx-swap="innerHTML">
          {{t "nav.crossCheck"}}
        </a>
        <a href="#" class="nav-item" hx-get="/tab/thumbnails" hx-target="#tab-content" hx-swap="innerHTML">
          {{t "nav.thumbnails"}}
        </a>
        <hr>
        <a href="#" class="nav-item" hx-get="/tab/history" hx-target="#tab-content" hx-swap="innerHTML">
          {{t "nav.history"}}
        </a>
      </nav>
      <div class="sidebar-footer">
        <p class="muted">{{t "nav.footer"}}</p>
      </div>
    </aside>

    <main class="app-main" id="tab-content">
      {{template "selfcheck_form.html" .}}
    </main>
  </div>

  <script>
    // Sidebar tab highlighting on htmx swap
    document.body.addEventListener('htmx:afterRequest', (e) => {
      if (e.target.classList && e.target.classList.contains('nav-item')) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        e.target.classList.add('active');
      }
    });

    // Language switcher: persist the choice server-side, then reload so
    // every template (including inline tmap JSON) renders in the new locale.
    document.getElementById('lang-select').addEventListener('change', async (e) => {
      const body = new URLSearchParams({ lang: e.target.value });
      const res = await fetch('/api/lang', { method: 'POST', body });
      if (res.ok) location.reload();
    });
  </script>
</body>
</html>
