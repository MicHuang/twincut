<section class="tab-section">
  <header class="tab-section-header">
    <h2>{{t "selfcheck.title"}}</h2>
    <p class="subtitle">{{t "selfcheck.intro"}}</p>
  </header>

  <form id="selfcheck-form"
        hx-post="/api/self-check/preview"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        hx-disabled-elt="find button">

    <label class="field">
      <span class="field-label">{{t "selfcheck.folderLabel"}}</span>
      <div class="folder-picker">
        <input type="text" name="folder" id="folder-input"
               placeholder="/path/to/your/photos"
               value="{{.DefaultFolder}}"
               autocomplete="off"
               required>
        <button type="button" class="btn btn-secondary"
                hx-get="/fs/list?path={{.DefaultFolder}}"
                hx-target="#folder-tree"
                hx-swap="innerHTML">
          {{t "common.browse"}}
        </button>
      </div>
      {{if .Recents}}
      <div class="recents">
        <span class="muted">{{t "common.recent"}}</span>
        {{range .Recents}}
          <button type="button" class="chip" data-path="{{.}}"
                  onclick="document.getElementById('folder-input').value='{{.}}'">{{.}}</button>
        {{end}}
      </div>
      {{end}}
      <div id="folder-tree"></div>
    </label>

    <details class="advanced">
      <summary>{{t "selfcheck.advanced"}}</summary>
      <div class="advanced-grid">
        <label class="field">
          <span class="field-label">{{t "selfcheck.algo"}}</span>
          <select name="algo">
            <option value="md5" selected>{{t "selfcheck.algo.md5"}}</option>
            <option value="sha1">{{t "selfcheck.algo.sha1"}}</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">{{t "selfcheck.minSize"}}</span>
          <input type="text" name="min_size" value="0k" placeholder="e.g. 300k or 1M">
        </label>
        <label class="field field-wide">
          <span class="field-label">{{t "selfcheck.exts"}}</span>
          <input type="text" name="ext" placeholder="jpg,png,mp4,…">
        </label>
        <label class="field">
          <span class="field-label">{{t "selfcheck.simVideo"}}</span>
          <select name="include_similar_video">
            <option value="auto" selected>{{t "selfcheck.simVideo.auto"}}</option>
            <option value="on">{{t "selfcheck.simVideo.always"}}</option>
            <option value="off">{{t "selfcheck.simVideo.off"}}</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">{{t "selfcheck.sizeWindow"}}</span>
          <input type="text" name="size_pct" value="" placeholder="auto: 5 when sim-video on, else 0.5">
        </label>
      </div>
    </details>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{t "button.preview"}}</button>
      <p class="muted-inline">{{t "selfcheck.previewNote"}}</p>
    </div>
  </form>
</section>
