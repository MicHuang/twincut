<section class="tab-section">
  <header class="tab-section-header">
    <h2>{{t "crosscheck.title"}}</h2>
    <p class="subtitle">{{t "crosscheck.subtitle.pre"}}<strong>{{t "crosscheck.subtitle.source"}}</strong>{{t "crosscheck.subtitle.mid"}}<strong>{{t "crosscheck.subtitle.backup"}}</strong>{{t "crosscheck.subtitle.post"}}</p>
  </header>

  <form id="crosscheck-form"
        hx-post="/api/cross-check/preview"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        hx-disabled-elt="find button">

    <label class="field">
      <span class="field-label">{{t "crosscheck.sourceFolder"}}</span>
      <div class="folder-picker">
        <input type="text" name="source" id="source-input"
               placeholder="/Users/me/Pictures/2024"
               autocomplete="off" required>
      </div>
      {{if .Recents}}
      <div class="recents">
        {{range .Recents}}
          <button type="button" class="recent-chip"
                  onclick="document.getElementById('source-input').value=this.dataset.path"
                  data-path="{{.}}">{{.}}</button>
        {{end}}
      </div>
      {{end}}
    </label>

    <fieldset class="field">
      <legend class="field-label">{{t "crosscheck.backupFolders"}}</legend>
      <div id="backup-list">
        <div class="backup-row">
          <input type="text" name="backup" placeholder="/Volumes/backup-1" autocomplete="off">
          <button type="button" class="btn btn-icon btn-remove-backup"
                  onclick="this.parentElement.remove()">×</button>
        </div>
      </div>
      <button type="button" class="btn btn-secondary btn-small"
              hx-get="/api/cross-check/add-backup-row"
              hx-target="#backup-list"
              hx-swap="beforeend">+ {{t "crosscheck.addBackup"}}</button>
    </fieldset>

    <details class="advanced">
      <summary>{{t "selfcheck.advanced"}}</summary>
      <div class="advanced-grid">
        <label class="field">
          <span class="field-label">{{t "crosscheck.matchingMode"}}</span>
          <select name="matching_mode">
            <option value="exact" selected>{{t "crosscheck.mode.exact"}}</option>
            <option value="default">{{t "crosscheck.mode.default"}}</option>
            <option value="strict">{{t "crosscheck.mode.strict"}}</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">{{t "crosscheck.minSize"}}</span>
          <input type="text" name="min_size" placeholder="{{t "crosscheck.minSize.placeholder"}}">
        </label>
        <label class="field field-wide">
          <span class="field-label">{{t "crosscheck.extensions"}}</span>
          <input type="text" name="ext" placeholder="{{t "crosscheck.extensions.placeholder"}}">
        </label>
        <label class="field field-wide">
          <span class="field-label">{{t "crosscheck.customQuarantineDir"}}</span>
          <input type="text" name="quarantine" placeholder="{{t "crosscheck.customQuarantineDir.placeholder"}}">
        </label>
      </div>
    </details>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{t "button.preview"}}</button>
    </div>
  </form>
</section>
