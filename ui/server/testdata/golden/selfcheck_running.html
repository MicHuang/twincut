<section class="tab-section">
  <header class="tab-section-header">
    <h2>Applying…</h2>
    <p class="subtitle"><code>/tmp/g</code></p>
  </header>

  <div class="run-panel" id="run-panel"
       data-run-id="g1"
       data-next-url="/api/self-check/done/g1"
       data-show-actions="true">

    <div class="progress">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-stats">
        <span id="progress-text">Starting…</span>
        <span class="muted" id="progress-current"></span>
      </div>
    </div>

    <div class="run-counters">
      <div class="counter">
        <span class="counter-label">duplicates found</span>
        <span class="counter-value" id="counter-dups">0</span>
      </div>
      <div class="counter">
        <span class="counter-label">warnings</span>
        <span class="counter-value" id="counter-warns">0</span>
      </div>
    </div>

    <details class="log-panel">
      <summary>Show log</summary>
      <pre class="log-pre" id="log-pre"></pre>
    </details>

    <div class="form-actions">
      <button type="button" class="btn btn-tertiary"
              hx-post="/api/runs/g1/cancel"
              hx-swap="none">Cancel</button>
      <a href="#" class="btn btn-secondary" hx-get="/tab/self-check" hx-target="#tab-content">Back to form</a>
    </div>

  </div>
</section>

<script>
  (function () {
    const I18N = {"error":"Error","phase.apply":"Applying","phase.restore":"Restoring","phase.scan":"Scanning","streamClosed":"(stream closed)"};
    const panel = document.getElementById('run-panel');
    const runID = panel.dataset.runId;
    const nextURL = panel.dataset.nextUrl;
    const showActions = panel.dataset.showActions === 'true';
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');
    const progressCurrent = document.getElementById('progress-current');
    const dupsEl = document.getElementById('counter-dups');
    const warnsEl = document.getElementById('counter-warns');
    const logEl = document.getElementById('log-pre');
    
    
    
    
    const langSelect = document.getElementById('lang-select');

    let dups = 0, warns = 0;

    const es = new EventSource('/sse/' + runID);
    document.body.dataset.runActive = '1';
    if (langSelect) langSelect.disabled = true;
    es.addEventListener('progress', (e) => {
      const p = JSON.parse(e.data);
      const phase = I18N['phase.' + p.phase] ?? p.phase;
      if (p.total > 0) {
        const pct = Math.min(100, Math.round((p.done / p.total) * 100));
        progressFill.style.width = pct + '%';
        progressText.textContent = `${phase}: ${p.done.toLocaleString()} / ${p.total.toLocaleString()} (${pct}%)`;
      } else {
        progressText.textContent = `${phase}: ${p.done.toLocaleString()}`;
      }
      if (p.current_path) {
        progressCurrent.textContent = p.current_path.split('/').slice(-2).join('/');
      }
    });
    es.addEventListener('dup_group', () => { dups++; dupsEl.textContent = dups; });
    es.addEventListener('action', (e) => {
      if (showActions) {
        const p = JSON.parse(e.data);
        logEl.textContent += `${p.kind} ${p.src}\n`;
      }
    });
    es.addEventListener('warn', () => { warns++; warnsEl.textContent = warns; });
    es.addEventListener('error', (e) => {
      const p = JSON.parse(e.data);
      logEl.textContent += `ERROR: ${p.code} ${p.detail}\n`;
      progressText.textContent = I18N.error ?? 'Error';
    });
    es.addEventListener('run_end', (e) => {
      delete document.body.dataset.runActive;
      if (langSelect) langSelect.disabled = false;
      const p = JSON.parse(e.data);
      es.close();
      progressFill.style.width = '100%';
      
      htmx.ajax('GET', nextURL, { target: '#tab-content', swap: 'innerHTML' });
    });
    es.onerror = () => {
      
      if (es.readyState === EventSource.CLOSED) {
        progressText.textContent += ' ' + (I18N.streamClosed ?? '(stream closed)');
        delete document.body.dataset.runActive;
        if (langSelect) langSelect.disabled = false;
      }
    };
  })();
</script>
