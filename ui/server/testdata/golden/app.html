<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>twincut</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-title">twincut</div>
      <div class="app-header-spacer"></div>
      <div class="lang-switcher" title="Language">
        <select id="lang-select" aria-label="Language">
          <option value="en" selected>EN</option>
          <option value="zh-Hans">中文</option>
        </select>
      </div>
      <div class="app-status" title="Server status">● ready</div>
    </header>

    <aside class="app-sidebar">
      <nav>
        <a href="#" class="nav-item active" hx-get="/tab/self-check" hx-target="#tab-content" hx-swap="innerHTML">
          Self-check
        </a>
        <a href="#" class="nav-item" hx-get="/tab/cross-check" hx-target="#tab-content" hx-swap="innerHTML">
          Cross-check
        </a>
        <a href="#" class="nav-item" hx-get="/tab/thumbnails" hx-target="#tab-content" hx-swap="innerHTML">
          Thumbnails
        </a>
        <hr>
        <a href="#" class="nav-item" hx-get="/tab/history" hx-target="#tab-content" hx-swap="innerHTML">
          History
        </a>
      </nav>
      <div class="sidebar-footer">
        <p class="muted">twincut</p>
      </div>
    </aside>

    <main class="app-main" id="tab-content">
      <section class="tab-section">
  <header class="tab-section-header">
    <h2>Self-check</h2>
    <p class="subtitle">Find duplicates inside one folder. Hash-only by default. Always previews before moving anything.</p>
  </header>

  <form id="selfcheck-form"
        hx-post="/api/self-check/preview"
        hx-target="#tab-content"
        hx-swap="innerHTML"
        hx-disabled-elt="find button">

    <label class="field">
      <span class="field-label">Folder to scan</span>
      <div class="folder-picker">
        <input type="text" name="folder" id="folder-input"
               placeholder="/path/to/your/photos"
               value="/tmp/g"
               autocomplete="off"
               required>
        <button type="button" class="btn btn-secondary"
                hx-get="/fs/list?path=/tmp/g"
                hx-target="#folder-tree"
                hx-swap="innerHTML">
          Browse
        </button>
      </div>
      
      <div class="recents">
        <span class="muted">Recent:</span>
        
          <button type="button" class="chip" data-path="/tmp/g"
                  onclick="document.getElementById('folder-input').value='\/tmp\/g'">/tmp/g</button>
        
          <button type="button" class="chip" data-path="/tmp/h"
                  onclick="document.getElementById('folder-input').value='\/tmp\/h'">/tmp/h</button>
        
      </div>
      
      <div id="folder-tree"></div>
    </label>

    <details class="advanced">
      <summary>Advanced options</summary>
      <div class="advanced-grid">
        <label class="field">
          <span class="field-label">Hash algorithm</span>
          <select name="algo">
            <option value="md5" selected>md5 (faster)</option>
            <option value="sha1">sha1</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Min size</span>
          <input type="text" name="min_size" value="0k" placeholder="e.g. 300k or 1M">
        </label>
        <label class="field field-wide">
          <span class="field-label">Extensions (comma-separated, blank = default)</span>
          <input type="text" name="ext" placeholder="jpg,png,mp4,…">
        </label>
        <label class="field">
          <span class="field-label">Similar-video detection</span>
          <select name="include_similar_video">
            <option value="auto" selected>Auto (when folder has videos)</option>
            <option value="on">Always</option>
            <option value="off">Off</option>
          </select>
        </label>
        <label class="field">
          <span class="field-label">Similarity size window (%)</span>
          <input type="text" name="size_pct" value="" placeholder="auto: 5 when sim-video on, else 0.5">
        </label>
      </div>
    </details>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Preview</button>
      <p class="muted-inline">Preview is a dry-run. Nothing is moved until you click Apply on the next screen.</p>
    </div>
  </form>
</section>

    </main>
  </div>

  <script>
    
    document.body.addEventListener('htmx:afterRequest', (e) => {
      if (e.target.classList && e.target.classList.contains('nav-item')) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        e.target.classList.add('active');
      }
    });

    
    
    document.getElementById('lang-select').addEventListener('change', async (e) => {
      const body = new URLSearchParams({ lang: e.target.value });
      const res = await fetch('/api/lang', { method: 'POST', body });
      if (res.ok) location.reload();
    });
  </script>
</body>
</html>
